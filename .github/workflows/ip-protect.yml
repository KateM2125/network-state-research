# .github/workflows/ip-protect.yml
# Automatic IP protection on every push
# Generates hashes, timestamps on Bitcoin blockchain, pins to IPFS, archives to Wayback Machine

name: IP Protection Stack

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'research/**'
      - 'kol-series/**'
      - 'data/**'
      - 'fund/**'
  workflow_dispatch:

jobs:
  timestamp-and-protect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install opentimestamps-client requests

      - name: Generate SHA-256 manifest
        run: |
          echo '{"author": "Kathleen Maree Grey", "abn": "73 551 573 050", "generated": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "files": {}}' > /tmp/manifest_base.json

          python3 << 'EOF'
          import hashlib, json, os, glob

          manifest = json.load(open('/tmp/manifest_base.json'))

          patterns = ['papers/**/*', 'research/**/*', 'kol-series/**/*', 'data/**/*', 'fund/**/*']
          files_found = []
          for pattern in patterns:
              files_found.extend(glob.glob(pattern, recursive=True))

          for filepath in sorted(files_found):
              if os.path.isfile(filepath):
                  with open(filepath, 'rb') as f:
                      h = hashlib.sha256(f.read()).hexdigest()
                  manifest['files'][filepath] = {
                      'sha256': h,
                      'size': os.path.getsize(filepath),
                      'modified': os.path.getmtime(filepath)
                  }

          with open('timestamps/copyright-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          print(f"Manifest generated: {len(manifest['files'])} files hashed")
          EOF

      - name: Submit to OpenTimestamps
        run: |
          ots stamp timestamps/copyright-manifest.json || true
          echo "OpenTimestamps proof submitted"

      - name: Pin to IPFS via Pinata
        env:
          # Secret name is PINATAKETYS (intentional — matches the secret as registered in this repo).
          PINATA_JWT_RAW: ${{ secrets.PINATAKETYS }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ -z "$PINATA_JWT_RAW" ]; then
            echo "::warning::PINATAKETYS secret not set — skipping IPFS pin."
            exit 0
          fi
          # Strip whitespace, newlines, CR — paste-from-screenshot-OCR hazards
          PINATA_JWT=$(echo -n "$PINATA_JWT_RAW" | tr -d '[:space:]\r\n')
          RAW_LEN=${#PINATA_JWT_RAW}
          CLEAN_LEN=${#PINATA_JWT}
          PREFIX=$(echo -n "$PINATA_JWT" | head -c 4)
          echo "JWT raw length: $RAW_LEN, cleaned: $CLEAN_LEN, prefix: ${PREFIX}..."
          if [ "$PREFIX" != "eyJ" ]; then
            echo "::warning::JWT prefix is '$PREFIX' but should be 'eyJ'. This is likely the API Key or API Secret, not the JWT."
          fi

          # Base connectivity probe (no auth)
          BASE_HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://api.pinata.cloud/)
          echo "Base reachability HTTP: $BASE_HTTP (anything non-000 means we can reach Pinata)"

          # Auth probe with verbose curl
          echo "--- curl -v auth probe ---"
          curl -sS -v --max-time 30 \
            -o /tmp/auth_resp.json \
            -w 'HTTP_STATUS:%{http_code}\nEXITCODE_VIA_W:%{exitcode}\n' \
            -H "Authorization: Bearer $PINATA_JWT" \
            https://api.pinata.cloud/data/testAuthentication 2>&1 \
            | sed "s|$PINATA_JWT|***REDACTED***|g" \
            | tail -40
          AUTH_HTTP=$(curl -s -o /tmp/auth_resp.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $PINATA_JWT" \
            https://api.pinata.cloud/data/testAuthentication)
          echo "Auth probe HTTP: $AUTH_HTTP"
          echo "Auth probe body: $(cat /tmp/auth_resp.json | sed "s|$PINATA_JWT|***REDACTED***|g")"
          if [ "$AUTH_HTTP" != "200" ]; then
            echo "::error::Pinata auth failed (HTTP $AUTH_HTTP). See verbose log above."
            exit 1
          fi

          # Upload
          UPLOAD_HTTP=$(curl -s -o /tmp/upload_resp.json -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@timestamps/copyright-manifest.json" \
            -F 'pinataMetadata={"name":"copyright-manifest.json","keyvalues":{"repo":"network-state-research","source":"ip-protect.yml"}}' \
            -F 'pinataOptions={"cidVersion":1}' \
            https://api.pinata.cloud/pinning/pinFileToIPFS)
          echo "Upload HTTP: $UPLOAD_HTTP"
          echo "Upload body: $(cat /tmp/upload_resp.json)"
          if [ "$UPLOAD_HTTP" != "200" ]; then
            echo "::error::Pinata upload failed (HTTP $UPLOAD_HTTP)"
            exit 1
          fi

          CID=$(python3 -c "import sys, json; print(json.load(open('/tmp/upload_resp.json')).get('IpfsHash', ''))")
          if [ -z "$CID" ]; then
            echo "::error::Upload returned 200 but no IpfsHash in response"
            exit 1
          fi
          echo "Pinned to IPFS — CID: $CID"
          echo "$CID" > timestamps/ipfs-cid.txt
          echo "https://gateway.pinata.cloud/ipfs/$CID" > timestamps/ipfs-gateway-url.txt

      - name: Archive to Wayback Machine
        run: |
          # Submit repo URL to Wayback Machine
          curl -s "https://web.archive.org/save/https://github.com/KateM2125/network-state-research" || true
          echo "Wayback Machine archive requested"

      - name: Commit updated manifest and proofs
        run: |
          git config user.name "IP Protection Bot"
          git config user.email "kathleenmareegrey@gmail.com"
          git add timestamps/
          git diff --staged --quiet || git commit -m "Auto: IP protection - hashes, timestamps, proofs updated"
          git push || true
